name: Qmoosa Real Estate Web4 CI & Reality Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Lint, TypeScript & Web4 Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Fast Oxlint Verification
        run: npm run lint

      - name: Compile TypeScript & Vite Production Bundle
        run: npm run build
